<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- meta tags -->
    <title>Austin Wade Smith</title>

    <meta name="keywords" content="Austin Wade Smith, ecological institutions, oracle systems, regenerative technology, Regen Foundation, River Computer, Claims Engine, blockchain, climate tech, bioregional governance">
    <meta name="author" content="Austin Wade Smith">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://austinwadesmith.com/">
    <meta property="og:title" content="Austin Wade Smith">
    <meta property="og:description" content="Executive Director of Regen Foundation">
    
    <!-- socials -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://x.com/_newcubes_">

    <meta property="twitter:description" content="">
    
    <!-- canonical -->
    <link rel="canonical" href="https://austinwadesmith.com/">
    
    <!-- favi -->
    <link rel="icon" type="image/svg+xml" href="/icon1.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        .columns {
            display: grid;
            grid-template-columns: 2fr 3fr;
            gap: 60px;
            padding-top: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .column h2 {
            color: #1c1c1c;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .h2-icon,
        .section-tab-icon {
            width: 20px;
            height: 20px;
            display: inline-block;
            flex-shrink: 0;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .column p {
            color: #555;
            line-height: 1.8;
            margin-bottom: 0;
        }

        .column p a {
            color: rgb(218, 71, 17);
            text-decoration: none;
            word-break: break-word;
        }

        .list {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0 1.8em;
            align-items: start;
            width: 100%;
        }

        .list-date {
            color: #aeaeae;
            line-height: 1.8;
            text-align: right;
        }

        .list-content {
            color: #555;
            line-height: 1.8;
            overflow-wrap: break-word;
        }

        .list-content p {
            margin-bottom: 0;
            word-break: break-word;
        }

        .list-content a {
            word-break: break-word;
        }

        .list-description {
            color: #aeaeae;
            line-height: 1.8;
            margin-top: 0;
            font-style: italic;
        }

        .list-description a {
            color: #3CC0B8;
            text-decoration: none;
            word-break: break-word;
        }

        .three-column-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .three-column-links p {
            margin-bottom: 0;
        }

        .section-tabs {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        .section-tab {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1c1c1c;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-tab:hover {
            color: #555;
        }

        .section-tab.active {
            text-decoration: underline;
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        .mobile-only {
            display: none;
        }

        @media (max-width: 900px) {
            body {
                padding: 10px;
                overflow-x: hidden;
            }

            .container {
                padding: 10px;
            }

            .columns {
                grid-template-columns: 1fr;
                gap: 30px;
                padding-top: 10px;
            }

            .column {
                width: 100%;
            }

            .column#about-section {
                display: none;
            }

            .mobile-only {
                display: block;
            }

            .section-tabs {
                flex-direction: row;
                gap: 20px;
            }

            .section-tabs .mobile-only {
                display: flex;
            }

            .section-tab {
                width: auto;
                justify-content: flex-start;
            }

            .section-content {
                display: none !important;
            }

            .section-content.active {
                display: block !important;
            }

            .three-column-links {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .list {
                gap: 0 0.8em;
                grid-template-columns: 60px 1fr;
            }

            .list-date {
                font-size: 0.85em;
                min-width: 0;
            }

            .list-content {
                min-width: 0;
            }

            .h2-icon,
            .section-tab-icon {
                width: 18px;
                height: 18px;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load about.json
            fetch('about.json')
                .then(response => response.json())
                .then(data => {
                    const titleElement = document.getElementById('about-title');
                    const contentElement = document.getElementById('about-content');
                    
                    if (titleElement) {
                        titleElement.textContent = data.title;
                    }
                    
                    function generateAboutHTML(data) {
                        let html = '';
                        
                        data.paragraphs.forEach((para, index) => {
                            html += `<p>${para}</p>`;
                            if (index < data.paragraphs.length - 1) {
                                html += '<br>';
                            }
                        });
                        
                        if (data.links && data.links.length > 0) {
                            html += '<div class="three-column-links">';
                            data.links.forEach(link => {
                                html += `<p><a href="${link.url}">${link.text}</a></p>`;
                            });
                            html += '</div>';
                        }
                        
                        return html;
                    }
                    
                    if (contentElement) {
                        contentElement.innerHTML = generateAboutHTML(data);
                    }
                    
                    const mobileContentElement = document.getElementById('about-mobile-content');
                    if (mobileContentElement) {
                        mobileContentElement.innerHTML = generateAboutHTML(data);
                    }
                })
                .catch(error => {
                    console.error('Error loading about.json:', error);
                });
            
            // Load content.json for sections
            fetch('content.json')
                .then(response => response.json())
                .then(data => {
                    function generateListHTML(items) {
                        if (!items || items.length === 0) {
                            return '<div class="list"><div class="list-date"></div><div class="list-content"><p>coming soon...</p></div></div>';
                        }
                        
                        let html = '<div class="list">';
                        items.forEach(item => {
                            html += `<div class="list-date">${item.date || ''}</div>`;
                            html += '<div class="list-content">';
                            
                            // Build the title with optional link, italic, and suffix
                            let titleText = item.italic ? `<em>${item.title}</em>` : item.title;
                            if (item.url) {
                                titleText = `<a href="${item.url}">${titleText}</a>`;
                            }
                            html += `<p>${titleText}${item.suffix || ''}</p>`;
                            
                            // Add description if present
                            if (item.description) {
                                html += `<div class="list-description">${item.description}</div>`;
                            }

                            // Add a secondary link if present
                            if (item.secondaryUrl) {
                                html += `<div class="list-description"><a href="${item.secondaryUrl}">${item.secondaryText || 'Link'}</a></div>`;
                            }

                            html += '</div>';
                        });
                        html += '</div>';
                        return html;
                    }
                    
                    // Render each section
                    const sections = ['recent', 'talksandwriting', 'features', 'projects'];
                    sections.forEach(section => {
                        const container = document.querySelector(`#${section} .list-container`);
                        if (container && data[section]) {
                            container.innerHTML = generateListHTML(data[section]);
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading content.json:', error);
                });
            
            const tabs = document.querySelectorAll('.section-tab');
            const contents = document.querySelectorAll('.section-content');
            let mobileInitialized = false;
            
            // Function to activate a section by its ID
            function activateSection(sectionId) {
                tabs.forEach(t => t.classList.remove('active'));
                contents.forEach(c => c.classList.remove('active'));
                
                const targetTab = document.querySelector(`.section-tab[data-section="${sectionId}"]`);
                const targetContent = document.getElementById(sectionId);
                
                if (targetTab && targetContent) {
                    targetTab.classList.add('active');
                    targetContent.classList.add('active');
                }
            }
            
            // Function to get section from URL hash
            function getSectionFromHash() {
                const hash = window.location.hash.slice(1); // Remove the #
                const validSections = ['about', 'recent', 'talksandwriting', 'features', 'projects'];
                return validSections.includes(hash) ? hash : null;
            }
            
            // Handle initial load and hash changes
            function handleHashChange() {
                const sectionFromHash = getSectionFromHash();
                if (sectionFromHash) {
                    activateSection(sectionFromHash);
                } else if (window.innerWidth <= 900) {
                    activateSection('about');
                } else {
                    activateSection('recent');
                }
            }
            
            function handleMobileView() {
                if (window.innerWidth <= 900) {
                    if (!mobileInitialized) {
                        const sectionFromHash = getSectionFromHash();
                        if (sectionFromHash) {
                            activateSection(sectionFromHash);
                        } else {
                            activateSection('about');
                        }
                        mobileInitialized = true;
                    }
                } else {
                    mobileInitialized = false;
                }
            }
            
            // Initialize based on hash or default
            handleHashChange();
            handleMobileView();
            
            // Listen for hash changes (browser back/forward)
            window.addEventListener('hashchange', handleHashChange);
            
            let resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function() {
                    if (!mobileInitialized && window.innerWidth <= 900) {
                        handleMobileView();
                    }
                }, 250);
            });
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const sectionId = this.getAttribute('data-section');
                    
                    // Update URL hash without scrolling
                    history.pushState(null, null, `#${sectionId}`);
                    
                    activateSection(sectionId);
                });
            });
        });
    </script>

    </script>
</head>
<body>
    <div class="container">
        <div class="columns">
            <div class="column" id="about-section">
                <h2><img src="icon4.svg" alt="" class="h2-icon"><span id="about-title">About Austin Wade Smith</span></h2>

                </div>
                
                <div id="features" class="section-content">

                </div>
                
                <div id="projects" class="section-content">

                </div>
            </div>
        </div>
    </div>
</body>
